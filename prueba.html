<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Stream TV & Radio 🍕📺📻</title>

  <!-- Reproductor HLS.js para soportar streams .m3u8 📡 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    /* Pestañas de Navegación 🎛️ */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid transparent;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      border-color: var(--accent-color);
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000;
    }

    /* Zona del Reproductor 🎬 */
    .player-container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 30px auto;
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    video, iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border: none;
      display: block;
    }

    audio {
      width: 90%;
      margin: 20px 0;
    }

    .player-info {
      padding: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-color);
    }

    /* Rejilla de Canales y Emisoras 📱 */
    .grid-canales {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .canal-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .canal-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(56, 189, 248, 0.3);
    }

    .canal-card img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .canal-card span {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-color);
    }

    /* Ocultar elementos según pestaña 👁️ */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>Pizza Stream TV & Radio 🍕📺📻</h1>
    
    <!-- Pestañas para alternar entre TV y Radio -->
    <div class="tabs">
      <button class="tab-btn active" id="btnTv" onclick="window.cambiarSeccion('tv')">
        📺 Televisión
      </button>
      <button class="tab-btn" id="btnRadio" onclick="window.cambiarSeccion('radio')">
        📻 Emisoras
      </button>
    </div>
  </header>

  <main>
    <!-- Contenedor del Reproductor -->
    <section class="player-container">
      <!-- Reproductor de Video para TV -->
      <video id="miReproductorVideo" controls poster="https://via.placeholder.com/800x450/0f172a/38bdf8?text=Selecciona+un+Canal"></video>

      <!-- Reproductor iFrame para Transmisiones Embed 🖼️ -->
      <iframe id="miReproductorIframe" class="hidden" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>

      <!-- Reproductor de Audio para Radio (se oculta al ver TV) -->
      <audio id="miReproductorAudio" controls class="hidden"></audio>

      <!-- Nombre del canal/emisora en reproducción -->
      <div class="player-info" id="tituloReproduciendo">
        Selecciona un canal para comenzar 🎧
      </div>
    </section>

    <!-- Lista Dinámica de Canales (Cargada desde Firestore) -->
    <section class="grid-canales" id="listaCanalesContainer">
      <p style="text-align:center; grid-column: 1/-1;">Iniciando conexión... ⏳</p>
    </section>
  </main>

  <!-- LÓGICA DE FIREBASE Y REPRODUCTOR EN UN SOLO SCRIPT 🧠 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tu configuración intacta de Firebase ⚙️
    const firebaseConfig = {
      apiKey: "AIzaSyAwb7u2ce0DA1mt6ur2mIG61M5ummAKHaE",
      authDomain: "ejemplo-bc20a.firebaseapp.com",
      projectId: "ejemplo-bc20a",
      storageBucket: "ejemplo-bc20a.firebasestorage.app",
      messagingSenderId: "160513641512",
      appId: "1:160513641512:web:981f8e0acdccfa0fdff91d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Tu URL de Cloudflare Worker Proxy 🛡️
    const WORKER_PROXY = "https://pizza-proxy.adibabouakar.workers.dev/?url=";

    let hlsInstance = null;

    // 1. Cargar canales desde Firestore 📡
    async function cargarCanales(tipoDeseado) {
      const container = document.getElementById("listaCanalesContainer");
      if (container) {
        container.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Cargando canales desde Firestore... ⏳</p>";
      }

      try {
        const canalesRef = collection(db, "canales");
        const q = query(
          canalesRef, 
          where("tipo", "==", tipoDeseado), 
          where("activo", "==", true)
        );

        const querySnapshot = await getDocs(q);
        const listaCanales = [];

        querySnapshot.forEach((doc) => {
          listaCanales.push({ id: doc.id, ...doc.data() });
        });

        console.log(`Canales de ${tipoDeseado} cargados:`, listaCanales);
        renderizarListaUI(listaCanales);
      } catch (error) {
        console.error("Error al consultar Firestore:", error);
        if (container) {
          container.innerHTML = `<p style='text-align:center; grid-column: 1/-1; color: #ef4444;'>
            Error al conectar con Firestore ❌<br><small>${error.message}</small>
          </p>`;
        }
      }
    }

    // 2. Pintar la lista en la pantalla 🃏
    function renderizarListaUI(canales) {
      const container = document.getElementById("listaCanalesContainer");
      container.innerHTML = "";

      if (canales.length === 0) {
        container.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>No hay canales activos agregados en Firestore para esta sección 🤷‍♂️</p>";
        return;
      }

      canales.forEach((canal) => {
        const card = document.createElement("div");
        card.className = "canal-card";
        
        const logoUrl = canal.logo || "https://via.placeholder.com/70?text=Logo";
        
        card.innerHTML = `
          <img src="${logoUrl}" alt="${canal.nombre}" onerror="this.src='https://via.placeholder.com/70?text=Logo'">
          <span>${canal.nombre}</span>
        `;
        
        card.addEventListener("click", () => reproducirCanal(canal));
        container.appendChild(card);
      });
    }

    // 3. Reproducir el canal seleccionado 🎬
    function reproducirCanal(canal) {
      let urlFinal = canal.url;

      if (canal.useProxy) {
        urlFinal = `${WORKER_PROXY}${encodeURIComponent(canal.url)}`;
      }

      console.log("Reproduciendo:", canal.nombre, "URL:", urlFinal);
      
      const titulo = document.getElementById("tituloReproduciendo");
      if (titulo) titulo.innerText = `Reproduciendo: ${canal.nombre} 🎶`;

      const video = document.getElementById("miReproductorVideo");
      const audio = document.getElementById("miReproductorAudio");
      const iframe = document.getElementById("miReproductorIframe");

      // Limpiar y pausar transmisiones previas
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      audio.pause();
      if (iframe) iframe.src = "about:blank"; // Limpia el iframe para cortar el audio en segundo plano

      // Caso 1: Si el canal utiliza un Iframe 🖼️
      if (canal.isIframe) {
        video.classList.add("hidden");
        audio.classList.add("hidden");
        
        if (iframe) {
          iframe.classList.remove("hidden");
          iframe.src = urlFinal;
        }
        return;
      }

      // Caso 2: Transmisión estándar (Video HLS o Audio) 📡
      if (iframe) iframe.classList.add("hidden");

      if (canal.tipo === "tv") {
        video.classList.remove("hidden");
        audio.classList.add("hidden");

        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(urlFinal);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.log("Autoplay bloqueado por el navegador:", e));
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = urlFinal;
          video.play().catch(e => console.log("Autoplay bloqueado por el navegador:", e));
        } else {
          video.src = urlFinal;
          video.play().catch(e => console.log("Autoplay bloqueado por el navegador:", e));
        }
      } else {
        audio.classList.remove("hidden");
        video.classList.add("hidden");

        audio.src = urlFinal;
        audio.play().catch(e => console.log("Autoplay bloqueado por el navegador:", e));
      }
    }

    // 4. Cambiar entre TV y Radio 🎛️
    function cambiarSeccion(tipo) {
      const btnTv = document.getElementById("btnTv");
      const btnRadio = document.getElementById("btnRadio");

      if (tipo === "tv") {
        btnTv.classList.add("active");
        btnRadio.classList.remove("active");
      } else {
        btnRadio.classList.add("active");
        btnTv.classList.remove("active");
      }

      cargarCanales(tipo);
    }

    // Hacer visibles las funciones globalmente 🌐
    window.cambiarSeccion = cambiarSeccion;
    window.reproducirCanal = reproducirCanal;

    // Arrancar automáticamente en la sección TV 🚀
    document.addEventListener("DOMContentLoaded", () => {
      cambiarSeccion("tv");
    });
  </script>
</body>
</html>
