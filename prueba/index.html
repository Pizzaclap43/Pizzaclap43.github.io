<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Dinámico de ClassiCube</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --button-hover: #e6b800;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            text-align: center;
        }

        .search-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }

        #search-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid #333;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--accent-color);
        }

        #search-btn {
            padding: 12px 22px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        #search-btn:hover {
            background-color: var(--button-hover);
        }

        .result-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 15px #ffcc0044;
            display: none;
            max-width: 600px;
            width: 100%;
        }

        .username {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .images-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .image-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-box h3 {
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .pixel-preview {
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
            background-color: #2a2a2a;
            border-radius: 5px;
            object-fit: contain;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .download-btn {
            background-color: var(--accent-color);
            color: #000;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: var(--button-hover);
        }

        #error-msg {
            color: #ff6b6b;
            background: #2a1a1a;
            border: 1px solid #ff6b6b44;
            border-radius: 8px;
            padding: 15px;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Buscador Dinámico de Skins y Face de ClassiCube</h1>

    <div class="search-wrapper">
        <input type="search" id="search-input" placeholder="Escribe el nombre del jugador...">
        <button id="search-btn">🔍 Buscar</button>
    </div>

    <div id="error-msg">⚠️ ¡Epa, chamo! Parece que no hay skin ni face para ese jugador o escribiste mal el nombre.</div>

    <div class="result-card" id="result-section">
        <div class="username" id="display-username">NombreDelJugador</div>
        
        <div class="images-container">
            <div class="image-box">
                <h3>Skin</h3>
                <img id="img-skin" class="pixel-preview" src="" alt="Skin">
                <button id="btn-download-skin" class="download-btn">Descargar Skin</button>
            </div>

            <div class="image-box">
                <h3>Face</h3>
                <img id="img-face" class="pixel-preview" src="" alt="Face">
                <button id="btn-download-face" class="download-btn">Descargar Face</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Buscador de Skins y Face - Desarrollado para la comunidad de ClassiCube con mucho ❤️</p>
    </footer>

    <script>
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultSection = document.getElementById('result-section');
        const errorMsg = document.getElementById('error-msg');

        const displayUsername = document.getElementById('display-username');
        const imgSkin = document.getElementById('img-skin');
        const imgFace = document.getElementById('img-face');
        const btnDownloadSkin = document.getElementById('btn-download-skin');
        const btnDownloadFace = document.getElementById('btn-download-face');

        let currentSkinUrl = '';
        let currentFaceUrl = '';
        let currentQuery = '';

        async function descargarArchivo(url, nombreArchivo) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = nombreArchivo;
                
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (error) {
                window.open(url, '_blank');
            }
        }

        function buscarJugador() {
            const query = searchInput.value.trim();
            if (!query) return;

            currentQuery = query;
            resultSection.style.display = 'none';
            errorMsg.style.display = 'none';

            currentSkinUrl = `https://cdn.classicube.net/skin/${query}.png`;
            currentFaceUrl = `https://cdn.classicube.net/face/${query}.png`;

            displayUsername.textContent = query;

            imgSkin.src = currentSkinUrl;
            imgFace.src = currentFaceUrl;

            resultSection.style.display = 'block';

            imgSkin.onerror = function() {
                resultSection.style.display = 'none';
                errorMsg.style.display = 'block';
            };
            
            imgFace.onerror = function() {
                imgFace.src = 'https://www.classicube.net/static/img/skin_placeholder.png';
            };
        }

        // Asignar eventos a los botones de descarga con la función Blob
        btnDownloadSkin.addEventListener('click', () => {
            descargarArchivo(currentSkinUrl, `${currentQuery}_skin.png`);
        });

        btnDownloadFace.addEventListener('click', () => {
            descargarArchivo(currentFaceUrl, `${currentQuery}_face.png`);
        });

        searchBtn.addEventListener('click', buscarJugador);

        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') buscarJugador();
        });
    </script>

</body>
</html>
